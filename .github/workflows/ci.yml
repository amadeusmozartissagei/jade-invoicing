# Lint, test, and build on every push to main and every pull request.
# Actions are pinned to commit SHAs (tags can be moved); the comment names the
# release. Tool versions match the ones used locally (ADR 0010).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on pull requests only; every main commit is
  # deployed, so each one keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  REDOCLY_CLI_VERSION: 2.72.1
  SUPABASE_CLI_VERSION: 2.122.0
  SQLC_VERSION: 1.31.1

jobs:
  contract:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npx --yes "@redocly/cli@${REDOCLY_CLI_VERSION}" lint openapi/openapi.yaml

  api-lint:
    name: API lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Verify module checksums
        run: go mod verify
      - uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}
      - name: Generated code is up to date
        run: |
          go generate ./...
          go mod tidy
          if [ -n "$(git status --porcelain -- .)" ]; then
            git status --porcelain -- .
            echo "::error::Run 'go generate ./...' and 'go mod tidy' in apps/api and commit the result"
            exit 1
          fi
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          # Build with the Go from go.mod, as locally: the release binary is
          # built with Go 1.27.0, older than go.mod's 1.27.3.
          install-mode: goinstall
          working-directory: apps/api
      - name: Build
        run: go build -o /dev/null ./cmd/api
      # The Vercel build: Typst checked against its SHA-256 and embedded
      # (ADR 0017, D9).
      - name: Build as on Vercel
        run: |
          sh scripts/fetch-typst.sh internal/invoicepdf/embedded
          go build -tags typst_embedded -o /dev/null ./cmd/api

  api-test:
    name: API tests (with local Supabase Postgres and Storage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      # Postgres, Storage, and Kong (which routes /storage/v1) only
      # (ADR 0017, D7). start applies the migrations.
      - name: Start Postgres and Storage and apply migrations
        run: |
          supabase start -x gotrue,realtime,imgproxy,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          supabase status -o env | sed -n 's/^STORAGE_S3_URL=/TEST_S3_ENDPOINT=/p; s/^S3_PROTOCOL_REGION=/TEST_S3_REGION=/p; s/^S3_PROTOCOL_ACCESS_KEY_ID=/TEST_S3_ACCESS_KEY_ID=/p; s/^S3_PROTOCOL_ACCESS_KEY_SECRET=/TEST_S3_SECRET_ACCESS_KEY=/p' | tr -d '"' >> "$GITHUB_ENV"
      - name: Install pdftotext
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Fetch Typst
        working-directory: apps/api
        run: sh scripts/fetch-typst.sh
      - name: Test
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:44322/postgres
          PDF_SAMPLE_DIR: ${{ runner.temp }}/pdf
        run: |
          mkdir -p "$PDF_SAMPLE_DIR"
          go test -race -count=1 ./...
      # Criterion 9 of ADR 0017: the rendered PDFs are valid PDF/A-3b. The
      # image is pinned by digest (pulled 2026-11-23).
      - name: Validate sample PDFs with veraPDF
        run: |
          # The tests write the samples as 0600; the container runs as
          # another user.
          chmod a+r "$RUNNER_TEMP"/pdf/*.pdf
          docker run --rm -v "$RUNNER_TEMP/pdf:/data" verapdf/cli@sha256:c2ac9448973a56acd833c81441e38d2dca58ea26a2ce1621e9a32e85d3d2728f --flavour 3b --format text $(cd "$RUNNER_TEMP/pdf" && printf '/data/%s ' *.pdf) | tee verapdf.txt
          test "$(grep -c '^PASS' verapdf.txt)" -eq "$(ls "$RUNNER_TEMP/pdf" | wc -l)"
          test "$(grep -c '^PASS' verapdf.txt)" -ge 5
