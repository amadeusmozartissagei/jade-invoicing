openapi: 3.1.0
info:
  title: jade-invoicing API
  version: 0.1.0
  summary: Multi-tenant invoicing that follows Japanese and German invoice rules.
  description: |
    Phase 1 contract. Design and reasoning: `docs/design/api.md`, ADR 0008 (API) and ADR 0009 (webhooks).

    **Conventions**

    - Authenticate with `Authorization: Bearer jade_sk_<prefix>_<secret>`.
    - Every `POST` requires an `Idempotency-Key` header. Only successful responses are stored, for 24 hours,
      and replayed with `Idempotent-Replayed: true`.
    - `PATCH` and `DELETE` of a draft require `If-Match` with the draft's `ETag`.
    - Amounts, quantities, prices, and rates are decimal strings, never JSON numbers. An amount must not have
      more decimals than its currency allows (EUR 2, JPY 0); it is rejected, not rounded.
    - Errors are RFC 9457 problem details (`application/problem+json`). `type` identifies the error and `code` is
      its short form; never parse `title` or `detail`. `422` means the request content is wrong; `409` means the
      current state of the resources does not allow the request yet. Types: `docs/api/errors.md`.
    - Request bodies with unknown fields are rejected (`unknown_field`), so a typo cannot be ignored silently.
    - Responses may gain new fields and enums may gain new values without a new API version. Clients must
      ignore unknown fields and handle unknown enum values.
    - All synthetic examples; no real companies, people, or tax numbers.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080/v1
    description: Local development server (`apps/api`)
  - url: https://jade-invoicing-api.vercel.app/v1
    description: Public demo (Vercel, fra1). Synthetic data only; endpoints arrive during phase 1.
security:
  - apiKey: []
tags:
  - name: Tenant
    description: The tenant's settings, seller details, and number series
  - name: API keys
    description: Keys that authenticate the tenant's requests
  - name: Customers
    description: The tenant's customers (buyers)
  - name: Invoices
    description: Invoices, credit notes, and corrected invoices, from draft to issued, voided, or corrected
  - name: Payments
    description: Payments recorded against issued invoices
  - name: Webhooks
    description: Endpoints that receive signed events, and their deliveries

paths:
  /tenant:
    get:
      tags: [Tenant]
      operationId: getTenant
      summary: Read the tenant's settings
      responses:
        '200':
          description: The tenant
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tenant'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}

  /seller-profile:
    get:
      tags: [Tenant]
      operationId: getSellerProfile
      summary: Read the seller details printed on invoices
      responses:
        '200':
          description: The seller profile
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SellerProfile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      tags: [Tenant]
      operationId: putSellerProfile
      summary: Replace the seller details
      description: |
        Omitted fields become null. Completeness is not checked here; issuing an invoice checks it and lists
        what is missing. Issued invoices keep their own copy, so this never changes them.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SellerProfileInput'}
      responses:
        '200':
          description: The updated seller profile
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SellerProfile'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {$ref: '#/components/responses/ContentTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
        '500': {$ref: '#/components/responses/InternalError'}

  /number-series:
    get:
      tags: [Tenant]
      operationId: listNumberSeries
      summary: List number series
      responses:
        '200':
          description: All series of the tenant (not paginated; a tenant has few)
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/NumberSeries'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Tenant]
      operationId: createNumberSeries
      summary: Create a number series
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NumberSeriesCreate'}
            example:
              code: credit
              prefix: CN-2026-
              padding: 6
      responses:
        '201':
          description: Created
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
            Location: {$ref: '#/components/headers/Location'}
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NumberSeries'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/ContentTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api-keys:
    get:
      tags: [API keys]
      operationId: listApiKeys
      summary: List API keys
      description: Never returns secrets.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of keys, newest first
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiKeyList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [API keys]
      operationId: createApiKey
      summary: Create an API key
      description: |
        The full key is in this response only. A replay of this request returns `key: null` and
        `secret_redacted: true`; a client that lost the first response revokes the key and creates another.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApiKeyCreate'}
            example:
              name: billing-service production
      responses:
        '201':
          description: Created
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
            Location: {$ref: '#/components/headers/Location'}
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiKeyCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/ContentTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api-keys/{id}/revoke:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [API keys]
      operationId: revokeApiKey
      summary: Revoke an API key
      description: |
        Takes effect immediately. Revoking the key that makes the request is rejected
        (`cannot_revoke_current_key`), so a tenant cannot lock itself out by mistake. Revoking an
        already revoked key returns it unchanged.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The revoked key
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiKey'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
        '500': {$ref: '#/components/responses/InternalError'}

  /customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: List customers
      parameters:
        - name: external_ref
          in: query
          description: Only the customer with this client-side ID
          schema: {type: string, maxLength: 100}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of customers, newest first
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CustomerList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create a customer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CustomerCreate'}
            example:
              external_ref: cust-1001
              kind: business
              name: Beispiel Handels GmbH
              address_line1: Musterstraße 1
              city: Berlin
              post_code: '10115'
              country_code: DE
              vat_id: DE000000000
              established_in_de: true
              email: billing@example.com
      responses:
        '201':
          description: Created
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
            Location: {$ref: '#/components/headers/Location'}
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Customer'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/ContentTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
        '500': {$ref: '#/components/responses/InternalError'}

  /customers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Read a customer
      responses:
        '200':
          description: The customer
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Customer'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      tags: [Customers]
      operationId: patchCustomer
      summary: Update a customer
      description: |
        JSON Merge Patch (RFC 7396): fields present are set, `null` clears an optional field, absent fields
        stay. Issued invoices keep their own copy of the customer, so this never changes them.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/CustomerPatch'}
      responses:
        '200':
          description: The updated customer
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Customer'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/ContentTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
        '500': {$ref: '#/components/responses/InternalError'}

  /invoices:
    get:
      tags: [Invoices]
      operationId: listInvoices
      summary: List invoices, credit notes, and corrected invoices
      description: |
        For browsing, not for syncing: a row whose transaction commits late can be missed while paging.
        Use webhooks to keep a copy in sync.
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/InvoiceStatus'}
        - name: document_type
          in: query
          schema: {$ref: '#/components/schemas/DocumentType'}
        - name: customer_id
          in: query
          schema: {type: string, format: uuid}
        - name: created_after
          in: query
          description: Inclusive lower bound on `created_at`
          schema: {type: string, format: date-time}
        - name: created_before
          in: query
          description: Exclusive upper bound on `created_at`
          schema: {type: string, format: date-time}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of invoices, newest first
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvoiceList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Invoices]
      operationId: createInvoice
      summary: Create a draft
      description: |
        Creates a draft invoice, credit note, or corrected invoice. Drafts have no number and no legal effect.

        - `credit_note` and `corrected_invoice` need `preceding_invoice_id`, which must refer to an issued
          `invoice` or `corrected_invoice`. Their `customer_id` defaults to the preceding invoice's customer
          and must equal it.
        - A `corrected_invoice` restates all items of the original (ADR 0007, D10).
        - `series_id` defaults to the tenant's `default` series.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InvoiceCreate'}
            examples:
              germanInvoice:
                summary: A German invoice with two VAT rates
                value:
                  customer_id: 7d1e2f4a-0c3b-4e5f-8a9b-1c2d3e4f5a6b
                  supply_date: '2026-10-30'
                  due_date: '2026-11-30'
                  buyer_reference: '-'
                  lines:
                    - name: Consulting, October
                      quantity: '10'
                      unit_code: HUR
                      unit_price: '95.00'
                      tax_rate: '19'
                    - name: Technical book
                      quantity: '1'
                      unit_price: '39.90'
                      tax_rate: '7'
              creditNote:
                summary: A partial credit note
                value:
                  document_type: credit_note
                  preceding_invoice_id: 0b6c8e1d-2f3a-4b5c-9d6e-7f8a9b0c1d2e
                  supply_date: '2026-10-30'
                  note: Discount for late delivery
                  lines:
                    - name: Discount on consulting, October
                      quantity: '1'
                      unit_price: '50.00'
                      tax_rate: '19'
      responses:
        '201':
          description: The draft
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
            Location: {$ref: '#/components/headers/Location'}
            ETag: {$ref: '#/components/headers/ETag'}
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invoice'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/ContentTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
        '500': {$ref: '#/components/responses/InternalError'}

  /invoices/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Invoices]
      operationId: getInvoice
      summary: Read an invoice (status polling)
      description: Includes lines, tax breakdown, totals, status, and the derived payment state.
      responses:
        '200':
          description: The invoice
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invoice'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      tags: [Invoices]
      operationId: patchInvoice
      summary: Edit a draft
      description: |
        JSON Merge Patch (RFC 7396). `lines`, when present, replaces all lines. Totals and the tax
        breakdown are recalculated. Only drafts can be edited (`invoice_not_draft`).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/InvoicePatch'}
      responses:
        '200':
          description: The updated draft
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invoice'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '413': {$ref: '#/components/responses/ContentTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Invoices]
      operationId: deleteInvoice
      summary: Delete a draft
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Deleted
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}

  /invoices/{id}/issue:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Invoices]
      operationId: issueInvoice
      summary: Issue a draft
      description: |
        Checks completeness, assigns the next number from the draft's series, computes the totals and tax
        breakdown, copies the seller and buyer details, and freezes the document. From then on it cannot be
        changed, only voided or corrected.

        - `409 invoice_incomplete` lists everything that is missing in `errors`; complete it and issue again.
        - Issuing a `corrected_invoice` moves the original to `corrected`; issuing a `credit_note` fails with
          `409 credit_exceeds_invoice` if all credit notes together would exceed the original's total.
        - `If-Match` is optional; when given, the draft must still have that version.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchOptional'
      responses:
        '200':
          description: The issued document
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invoice'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
        '500': {$ref: '#/components/responses/InternalError'}

  /invoices/{id}/void:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Invoices]
      operationId: voidInvoice
      summary: Void an issued invoice
      description: |
        Issues a credit note for the full amount that refers to the original, and marks the original
        `voided`, in one transaction (ADR 0007, D4). Only an issued `invoice` or `corrected_invoice` can be
        voided.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VoidRequest'}
            example:
              reason: Invoice sent to the wrong customer
      responses:
        '200':
          description: The voided original and the credit note issued for it
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VoidResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/ContentTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
        '500': {$ref: '#/components/responses/InternalError'}

  /invoices/{id}/files:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Invoices]
      operationId: listInvoiceFiles
      summary: List an invoice's files with download URLs
      description: |
        Each file has a signed download URL that expires after a few minutes; request the list again for a
        fresh one. The list is empty until a file has been rendered. Archived files are never regenerated;
        `sha256` proves they are unchanged.
      responses:
        '200':
          description: The files
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/InvoiceFile'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /invoices/{id}/payments:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Payments]
      operationId: listPayments
      summary: List an invoice's payments
      responses:
        '200':
          description: All payments of the invoice, oldest first (not paginated)
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Payment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Payments]
      operationId: recordPayment
      summary: Record a payment
      description: |
        Only for an issued `invoice` or `corrected_invoice` (`payment_not_allowed` otherwise). Payments are
        never changed or deleted. When the payments reach `amount_due`, the invoice becomes `paid` and an
        `invoice.paid` event is sent once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentCreate'}
            example:
              amount: '1190.00'
              paid_on: '2026-11-20'
              method: bank_transfer
      responses:
        '201':
          description: The recorded payment
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/ContentTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
        '500': {$ref: '#/components/responses/InternalError'}

  /webhook-endpoints:
    get:
      tags: [Webhooks]
      operationId: listWebhookEndpoints
      summary: List webhook endpoints
      description: Never returns secrets.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of endpoints, newest first
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookEndpointList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      tags: [Webhooks]
      operationId: createWebhookEndpoint
      summary: Register a webhook endpoint
      description: |
        The signing secret is in this response only (a replay returns `secret: null` and
        `secret_redacted: true`). The URL must be `https://` on port 443; addresses that resolve to private,
        loopback, or link-local networks are refused when delivering.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebhookEndpointCreate'}
            example:
              url: https://hooks.example.com/jade
              event_types: [invoice.issued, invoice.paid]
      responses:
        '201':
          description: Created
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
            Location: {$ref: '#/components/headers/Location'}
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookEndpointCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/ContentTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
        '500': {$ref: '#/components/responses/InternalError'}

  /webhook-endpoints/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Webhooks]
      operationId: getWebhookEndpoint
      summary: Read a webhook endpoint
      responses:
        '200':
          description: The endpoint
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookEndpoint'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      tags: [Webhooks]
      operationId: patchWebhookEndpoint
      summary: Update a webhook endpoint
      description: |
        JSON Merge Patch. There is no delete; disable an endpoint with `enabled: false`. Enabling it again
        clears `disabled_reason`.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/WebhookEndpointPatch'}
      responses:
        '200':
          description: The updated endpoint
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookEndpoint'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/ContentTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
        '500': {$ref: '#/components/responses/InternalError'}

  /webhook-endpoints/{id}/rotate-secret:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Webhooks]
      operationId: rotateWebhookSecret
      summary: Rotate the signing secret
      description: |
        Returns the new secret once. For 24 hours deliveries carry two signatures, one per secret, so the
        receiver can switch without losing events. A replay returns `secret: null` and
        `secret_redacted: true`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The new secret
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookSecretRotated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
        '500': {$ref: '#/components/responses/InternalError'}

  /webhook-endpoints/{id}/deliveries:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Webhooks]
      operationId: listWebhookDeliveries
      summary: List an endpoint's deliveries
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/DeliveryStatus'}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of deliveries, newest first
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookDeliveryList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /webhook-deliveries/{id}/redeliver:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Webhooks]
      operationId: redeliverWebhook
      summary: Queue a dead delivery again
      description: |
        Only for deliveries with status `dead` (`delivery_not_dead` otherwise). The retry schedule starts
        over. The endpoint must be enabled.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The delivery, now `pending`
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookDelivery'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableContent'}
        '500': {$ref: '#/components/responses/InternalError'}

webhooks:
  invoiceEvent:
    post:
      tags: [Webhooks]
      operationId: receiveInvoiceEvent
      summary: An event sent to a registered endpoint
      description: |
        Signed per the Standard Webhooks specification (ADR 0009). Verify with an official Standard Webhooks
        library: the signature is HMAC-SHA256 over `webhook-id + "." + webhook-timestamp + "." + body`, keyed
        with the bytes of the secret after `whsec_` (base64-decoded).

        - Reject timestamps more than 5 minutes from your clock.
        - Deduplicate on `webhook-id`: delivery is at least once.
        - Deliveries are not ordered. Use `timestamp` and `data.status`, or fetch the invoice.
        - Answer `2xx` within 15 seconds and process later. Anything else, a timeout, or a redirect is retried:
          after 5 s, 5 min, 30 min, 2 h, 5 h, 10 h, 14 h, 20 h, and 24 h (±10%). `410 Gone` disables the endpoint.
      parameters:
        - name: webhook-id
          in: header
          required: true
          description: The event ID, the same on every retry
          schema: {type: string, format: uuid}
        - name: webhook-timestamp
          in: header
          required: true
          description: Unix time in seconds when this attempt was signed
          schema: {type: string, pattern: '^[0-9]{1,12}$'}
          example: '1793525400'
        - name: webhook-signature
          in: header
          required: true
          description: One or more space-separated `v1,<base64>` signatures; two during a secret rotation
          schema: {type: string}
          example: v1,K5oZfzN95Z9UVu1EsfQmfVNQhnkZ2pj9o9NDN/H/pI4=
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Event'}
      responses:
        '2XX':
          description: Accepted by the receiver
        '410':
          description: The receiver no longer exists; the endpoint is disabled

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: jade_sk_<prefix>_<secret>
      description: |
        An API key of the tenant. Unknown, malformed, expired, and revoked keys all get the same `401`.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Unique per operation, scoped to the tenant; a UUID v4 is recommended. Send it as a quoted string, as
        the IETF draft specifies (`Idempotency-Key: "8e03978e-40d5-43e8-bc93-6894a57f9324"`); an unquoted value
        is also accepted. 1 to 255 printable ASCII characters inside the quotes. Valid for 24 hours. A repeat
        must send the same method, path, and body bytes.
      schema: {type: string, minLength: 1, maxLength: 257}
      example: '"8e03978e-40d5-43e8-bc93-6894a57f9324"'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The draft's current `ETag`. Missing gives `428`, stale gives `412`.
      schema: {type: string}
      example: '"3"'
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: When given, the draft must still have this `ETag` (`412` otherwise).
      schema: {type: string}
      example: '"3"'
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page, used with the same filters. Opaque.
      schema: {type: string, maxLength: 200}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}

  headers:
    RequestId:
      description: Server-generated ID of this request; quote it when reporting a problem
      schema: {type: string}
    Location:
      description: URL of the created resource
      schema: {type: string, format: uri-reference}
    ETag:
      description: The draft's version, for `If-Match`
      schema: {type: string}
      example: '"3"'
    IdempotentReplayed:
      description: '`true` when this is a stored response replayed for a repeated `Idempotency-Key`'
      schema: {type: string, enum: ['true']}
    RetryAfter:
      description: Seconds to wait before retrying
      schema: {type: integer, minimum: 0}

  responses:
    BadRequest:
      description: Malformed request (invalid JSON, bad query parameter, missing `Idempotency-Key`)
      headers:
        Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Missing or invalid API key
      headers:
        Request-Id: {$ref: '#/components/headers/RequestId'}
        WWW-Authenticate:
          schema: {type: string, const: Bearer}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: The tenant is suspended
      headers:
        Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: No such resource for this tenant
      headers:
        Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: |
        The request is fine, or has no content, but the current state of the resources it acts on does not
        allow it (for example `invoice_not_draft`, `invoice_incomplete` with `errors`), a duplicate
        (`conflict_external_ref`), or the same `Idempotency-Key` is being processed right now
        (`idempotency_key_in_use`, with `Retry-After`).
      headers:
        Request-Id: {$ref: '#/components/headers/RequestId'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionFailed:
      description: '`If-Match` does not match the current version'
      headers:
        Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ContentTooLarge:
      description: Request body over 1 MiB
      headers:
        Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    UnsupportedMediaType:
      description: Wrong `Content-Type`
      headers:
        Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    UnprocessableContent:
      description: |
        The request content is well-formed but wrong (`validation_failed`, with `errors`; unknown fields are
        rejected, not ignored), or an `Idempotency-Key` was reused with a different request
        (`idempotency_key_reused`).
      headers:
        Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://github.com/amadeusmozartissagei/jade-invoicing/blob/main/docs/api/errors.md#validation_failed
            title: Validation failed
            status: 422
            detail: 1 field is invalid.
            code: validation_failed
            request_id: req_01HZY3J8Q5W2
            errors:
              - pointer: /lines/0/quantity
                code: must_be_positive
                detail: quantity must be greater than 0
    PreconditionRequired:
      description: '`If-Match` is required'
      headers:
        Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    InternalError:
      description: Unexpected server error. Carries no internal details; quote `request_id`.
      headers:
        Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    # ---------- shared types ----------
    Amount:
      description: |
        Money as a decimal string with at most the currency's minor units (EUR 2, JPY 0). Negative only where
        a field says so.
      type: string
      pattern: '^-?[0-9]{1,16}(\.[0-9]{1,2})?$'
      examples: ['1190.00', '11900']
    PositiveAmount:
      description: A positive amount, as a decimal string
      type: string
      pattern: '^[0-9]{1,16}(\.[0-9]{1,2})?$'
      examples: ['1190.00']
    Quantity:
      description: Decimal string, up to 6 decimals
      type: string
      pattern: '^[0-9]{1,12}(\.[0-9]{1,6})?$'
      examples: ['2.5']
    TaxRate:
      description: Percentage as a decimal string; must be a valid rate for the jurisdiction on the supply date
      type: string
      pattern: '^[0-9]{1,3}(\.[0-9]{1,2})?$'
      examples: ['19', '7', '10', '8']
    Currency:
      type: string
      enum: [EUR, JPY]
    Jurisdiction:
      type: string
      enum: [DE, JP]
    CountryCode:
      description: ISO 3166-1 alpha-2
      type: string
      pattern: '^[A-Z]{2}$'
    DocumentType:
      description: '`invoice` (UNTDID 1001 code 380), `credit_note` (381), `corrected_invoice` (384)'
      type: string
      enum: [invoice, credit_note, corrected_invoice]
    InvoiceStatus:
      type: string
      enum: [draft, issued, voided, corrected]
    DeliveryStatus:
      type: string
      enum: [pending, succeeded, dead]
    EventType:
      type: string
      enum: [invoice.issued, credit_note.issued, invoice.voided, invoice.corrected, invoice.paid]
    NextCursor:
      description: Cursor for the next page, or null on the last page
      type: [string, 'null']

    # ---------- errors ----------
    Problem:
      description: RFC 9457 problem details
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
          format: uri
          description: |
            The problem type's identifier (RFC 9457 §3.1.1): the error's section in `docs/api/errors.md`.
            Never changes within `/v1`.
        title:
          type: string
          description: Short summary of the problem type; the same for every occurrence
        status:
          type: integer
        detail:
          type: string
          description: This occurrence, for a human. Do not parse it.
        code:
          type: string
          description: The fragment of `type` (`invoice_not_draft`), for logs and switch statements
        request_id:
          type: string
        errors:
          type: array
          description: Field-level problems, for `validation_failed` and `invoice_incomplete`
          items: {$ref: '#/components/schemas/FieldError'}
    FieldError:
      type: object
      required: [pointer, code, detail]
      properties:
        pointer:
          type: string
          description: |
            JSON Pointer (RFC 6901) into the request body. For `invoice_incomplete`, into the draft, or into the
            seller profile or customer with the prefix `/seller_profile` or `/customer`.
          examples: [/lines/0/quantity]
        code:
          type: string
          examples: [must_be_positive]
        detail:
          type: string

    # ---------- tenant ----------
    Tenant:
      type: object
      additionalProperties: false
      required: [id, name, jurisdiction, currency, timezone, jp_tax_rounding, fiscal_year_end_month, status, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        jurisdiction: {$ref: '#/components/schemas/Jurisdiction'}
        currency: {$ref: '#/components/schemas/Currency'}
        timezone:
          type: string
          description: IANA time zone; decides the issue date
          examples: [Europe/Berlin, Asia/Tokyo]
        jp_tax_rounding:
          description: Rounding of the consumption tax per rate, chosen by the issuer; null for DE
          type: [string, 'null']
          enum: [down, up, half_up, null]
        fiscal_year_end_month: {type: integer, minimum: 1, maximum: 12}
        status:
          type: string
          enum: [active, suspended]
        created_at: {type: string, format: date-time}

    SellerProfileFields:
      type: object
      properties:
        legal_name: {type: [string, 'null'], maxLength: 200, description: BT-27}
        trading_name: {type: [string, 'null'], maxLength: 200, description: BT-28}
        address_line1: {type: [string, 'null'], maxLength: 200, description: BT-35}
        address_line2: {type: [string, 'null'], maxLength: 200, description: BT-36}
        address_line3: {type: [string, 'null'], maxLength: 200, description: BT-162}
        city: {type: [string, 'null'], maxLength: 100, description: BT-37}
        post_code: {type: [string, 'null'], maxLength: 20, description: BT-38}
        country_subdivision: {type: [string, 'null'], maxLength: 100, description: BT-39}
        country_code:
          description: BT-40
          oneOf:
            - {$ref: '#/components/schemas/CountryCode'}
            - {type: 'null'}
        vat_id: {type: [string, 'null'], maxLength: 30, description: BT-31}
        tax_number: {type: [string, 'null'], maxLength: 30, description: 'BT-32, German Steuernummer'}
        jp_registration_number:
          description: Qualified invoice issuer registration number, `T` + 13 digits; required to issue in JP
          type: [string, 'null']
          pattern: '^T[0-9]{13}$'
        contact_name: {type: [string, 'null'], maxLength: 200, description: BT-41}
        contact_phone: {type: [string, 'null'], maxLength: 50, description: BT-42}
        contact_email: {type: [string, 'null'], format: email, maxLength: 254, description: BT-43}
        iban: {type: [string, 'null'], maxLength: 34, description: BT-84}
        bic: {type: [string, 'null'], maxLength: 11, description: BT-86}
        account_name: {type: [string, 'null'], maxLength: 200, description: BT-85}
    SellerProfileInput:
      allOf:
        - {$ref: '#/components/schemas/SellerProfileFields'}
      unevaluatedProperties: false
    SellerProfile:
      allOf:
        - {$ref: '#/components/schemas/SellerProfileFields'}
        - type: object
          required: [updated_at]
          properties:
            updated_at: {type: string, format: date-time}

    NumberSeries:
      type: object
      additionalProperties: false
      required: [id, code, prefix, padding, next_value, created_at]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        prefix: {type: string}
        padding: {type: integer}
        next_value:
          type: integer
          format: int64
          description: The counter the next issued document will get
        created_at: {type: string, format: date-time}
    NumberSeriesCreate:
      type: object
      additionalProperties: false
      required: [code, prefix, padding]
      properties:
        code: {type: string, pattern: '^[a-z0-9_-]{1,32}$'}
        prefix: {type: string, maxLength: 40}
        padding: {type: integer, minimum: 1, maximum: 12}

    # ---------- API keys ----------
    ApiKey:
      type: object
      additionalProperties: false
      required: [id, name, prefix, expires_at, revoked_at, last_used_at, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        prefix:
          type: string
          description: The public part of the key, to recognise it in logs and lists
        expires_at: {type: [string, 'null'], format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
        last_used_at:
          type: [string, 'null']
          format: date-time
          description: Updated at most once a minute
        created_at: {type: string, format: date-time}
    ApiKeyCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        expires_at: {type: [string, 'null'], format: date-time}
    ApiKeyCreated:
      allOf:
        - {$ref: '#/components/schemas/ApiKey'}
        - type: object
          required: [key, secret_redacted]
          properties:
            key:
              type: [string, 'null']
              description: The full key. Shown once; null on a replay.
              examples: [jade_sk_x7k2m9_EXAMPLEONLYnotarealsecret0000000000000000]
            secret_redacted:
              type: boolean
              description: true when this is a replay and the key was removed
    ApiKeyList:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/ApiKey'}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}

    # ---------- customers ----------
    CustomerFields:
      type: object
      properties:
        external_ref:
          type: [string, 'null']
          maxLength: 100
          description: The client's own ID; unique per tenant
        kind:
          type: string
          enum: [business, individual]
        name: {type: string, minLength: 1, maxLength: 200, description: BT-44}
        trading_name: {type: [string, 'null'], maxLength: 200, description: BT-45}
        address_line1: {type: [string, 'null'], maxLength: 200, description: BT-50}
        address_line2: {type: [string, 'null'], maxLength: 200, description: BT-51}
        address_line3: {type: [string, 'null'], maxLength: 200, description: BT-163}
        city: {type: [string, 'null'], maxLength: 100, description: BT-52}
        post_code: {type: [string, 'null'], maxLength: 20, description: BT-53}
        country_subdivision: {type: [string, 'null'], maxLength: 100, description: BT-54}
        country_code:
          description: BT-55
          oneOf:
            - {$ref: '#/components/schemas/CountryCode'}
            - {type: 'null'}
        vat_id: {type: [string, 'null'], maxLength: 30, description: BT-48}
        legal_registration_id: {type: [string, 'null'], maxLength: 50, description: BT-47}
        established_in_de:
          type: [boolean, 'null']
          description: With `kind`, decides whether an E-Rechnung is required (from phase 2)
        default_buyer_reference:
          type: [string, 'null']
          maxLength: 200
          description: BT-10 default for this customer's invoices
        contact_name: {type: [string, 'null'], maxLength: 200, description: BT-56}
        contact_phone: {type: [string, 'null'], maxLength: 50, description: BT-57}
        contact_email: {type: [string, 'null'], format: email, maxLength: 254, description: BT-58}
        email:
          type: [string, 'null']
          format: email
          maxLength: 254
          description: Where invoices are delivered
    CustomerCreate:
      allOf:
        - {$ref: '#/components/schemas/CustomerFields'}
        - type: object
          required: [kind, name]
      unevaluatedProperties: false
    CustomerPatch:
      description: JSON Merge Patch; `kind` and `name` cannot be null
      allOf:
        - {$ref: '#/components/schemas/CustomerFields'}
      unevaluatedProperties: false
    Customer:
      allOf:
        - {$ref: '#/components/schemas/CustomerFields'}
        - type: object
          required: [id, kind, name, created_at, updated_at]
          properties:
            id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    CustomerList:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Customer'}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}

    # ---------- invoices ----------
    InvoiceLineInput:
      type: object
      additionalProperties: false
      required: [name, quantity, unit_price, tax_rate]
      properties:
        name: {type: string, minLength: 1, maxLength: 200, description: BT-153}
        description: {type: [string, 'null'], maxLength: 1000, description: BT-154}
        quantity:
          allOf: [{$ref: '#/components/schemas/Quantity'}]
          description: BT-129; greater than 0
        unit_code:
          type: string
          default: C62
          pattern: '^[A-Z0-9]{1,3}$'
          description: BT-130, UN/ECE Recommendation 20 (C62 = one, HUR = hour)
        unit_price:
          allOf: [{$ref: '#/components/schemas/Quantity'}]
          description: BT-146, net price per `price_base_quantity`
        price_base_quantity:
          allOf: [{$ref: '#/components/schemas/Quantity'}]
          default: '1'
          description: BT-149; greater than 0
        tax_category:
          type: string
          enum: [S]
          default: S
          description: BT-151; only standard-rated in phase 1
        tax_rate:
          allOf: [{$ref: '#/components/schemas/TaxRate'}]
          description: BT-152
        period_start: {type: [string, 'null'], format: date, description: BT-134}
        period_end: {type: [string, 'null'], format: date, description: BT-135}
    InvoiceLine:
      type: object
      additionalProperties: false
      required: [position, name, description, quantity, unit_code, unit_price, price_base_quantity, tax_category, tax_rate, line_net_amount, period_start, period_end]
      properties:
        position: {type: integer, minimum: 1, description: BT-126}
        name: {type: string}
        description: {type: [string, 'null']}
        quantity: {$ref: '#/components/schemas/Quantity'}
        unit_code: {type: string}
        unit_price: {$ref: '#/components/schemas/Quantity'}
        price_base_quantity: {$ref: '#/components/schemas/Quantity'}
        tax_category: {type: string}
        tax_rate: {$ref: '#/components/schemas/TaxRate'}
        line_net_amount:
          allOf: [{$ref: '#/components/schemas/Amount'}]
          description: BT-131, quantity × unit_price / price_base_quantity, rounded half away from zero to the currency's minor unit
        period_start: {type: [string, 'null'], format: date}
        period_end: {type: [string, 'null'], format: date}
    TaxBreakdown:
      description: BG-23, one per VAT category and rate. Tax is rounded once per rate.
      type: object
      additionalProperties: false
      required: [tax_category, tax_rate, taxable_amount, tax_amount]
      properties:
        tax_category: {type: string, description: BT-118}
        tax_rate: {$ref: '#/components/schemas/TaxRate'}
        taxable_amount: {$ref: '#/components/schemas/Amount'}
        tax_amount: {$ref: '#/components/schemas/Amount'}
    InvoiceParty:
      description: Seller or buyer details as copied at issue. Fields that do not apply to the role are null.
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [seller, buyer]
        name: {type: [string, 'null'], description: BT-27 or BT-44}
        trading_name: {type: [string, 'null']}
        address_line1: {type: [string, 'null']}
        address_line2: {type: [string, 'null']}
        address_line3: {type: [string, 'null']}
        city: {type: [string, 'null']}
        post_code: {type: [string, 'null']}
        country_subdivision: {type: [string, 'null']}
        country_code: {type: [string, 'null']}
        vat_id: {type: [string, 'null']}
        tax_number: {type: [string, 'null']}
        legal_registration_id: {type: [string, 'null']}
        jp_registration_number: {type: [string, 'null']}
        contact_name: {type: [string, 'null']}
        contact_phone: {type: [string, 'null']}
        contact_email: {type: [string, 'null']}
        iban: {type: [string, 'null']}
        bic: {type: [string, 'null']}
        account_name: {type: [string, 'null']}
    InvoiceEditableFields:
      type: object
      properties:
        customer_id: {type: string, format: uuid}
        series_id: {type: string, format: uuid}
        supply_date: {type: [string, 'null'], format: date, description: BT-72}
        supply_period_start: {type: [string, 'null'], format: date, description: BT-73}
        supply_period_end: {type: [string, 'null'], format: date, description: BT-74}
        due_date: {type: [string, 'null'], format: date, description: BT-9}
        buyer_reference:
          type: [string, 'null']
          maxLength: 200
          description: BT-10; defaults to the customer's `default_buyer_reference`, then `-`
        order_reference: {type: [string, 'null'], maxLength: 200, description: BT-13}
        note: {type: [string, 'null'], maxLength: 2000, description: BT-22}
        payment_terms: {type: [string, 'null'], maxLength: 1000, description: BT-20}
        prepaid_amount:
          allOf: [{$ref: '#/components/schemas/PositiveAmount'}]
          description: BT-113, advance payments already received
        lines:
          type: array
          maxItems: 500
          items: {$ref: '#/components/schemas/InvoiceLineInput'}
    InvoiceCreate:
      allOf:
        - {$ref: '#/components/schemas/InvoiceEditableFields'}
        - type: object
          properties:
            document_type:
              allOf: [{$ref: '#/components/schemas/DocumentType'}]
              default: invoice
            preceding_invoice_id:
              type: string
              format: uuid
              description: BG-3; required for `credit_note` and `corrected_invoice`, not allowed for `invoice`
      unevaluatedProperties: false
    InvoicePatch:
      description: |
        JSON Merge Patch. `document_type` and `preceding_invoice_id` cannot change; `customer_id`,
        `series_id`, and `lines` cannot be null. `lines`, when present, replaces all lines.
      allOf:
        - {$ref: '#/components/schemas/InvoiceEditableFields'}
      unevaluatedProperties: false
    Invoice:
      type: object
      additionalProperties: false
      required:
        - id
        - document_type
        - status
        - customer_id
        - series_id
        - preceding_invoice_id
        - number
        - jurisdiction
        - currency
        - issue_date
        - supply_date
        - supply_period_start
        - supply_period_end
        - due_date
        - buyer_reference
        - order_reference
        - note
        - payment_terms
        - tax_rounding
        - line_net_total
        - allowance_total
        - charge_total
        - tax_exclusive_total
        - tax_total
        - tax_inclusive_total
        - prepaid_amount
        - rounding_amount
        - amount_due
        - amount_paid
        - payment_status
        - version
        - lines
        - tax_breakdown
        - parties
        - retention_until
        - issued_at
        - voided_at
        - void_reason
        - corrected_at
        - created_at
        - updated_at
      properties:
        id: {type: string, format: uuid}
        document_type: {$ref: '#/components/schemas/DocumentType'}
        status: {$ref: '#/components/schemas/InvoiceStatus'}
        customer_id: {type: string, format: uuid}
        series_id: {type: string, format: uuid}
        preceding_invoice_id: {type: [string, 'null'], format: uuid}
        number:
          type: [string, 'null']
          description: BT-1; null while draft
        jurisdiction: {$ref: '#/components/schemas/Jurisdiction'}
        currency: {$ref: '#/components/schemas/Currency'}
        issue_date:
          type: [string, 'null']
          format: date
          description: BT-2; set at issue, in the tenant's time zone
        supply_date: {type: [string, 'null'], format: date}
        supply_period_start: {type: [string, 'null'], format: date}
        supply_period_end: {type: [string, 'null'], format: date}
        due_date: {type: [string, 'null'], format: date}
        buyer_reference: {type: [string, 'null']}
        order_reference: {type: [string, 'null']}
        note: {type: [string, 'null']}
        payment_terms: {type: [string, 'null']}
        tax_rounding:
          type: [string, 'null']
          enum: [half_away_from_zero, down, up, half_up, null]
          description: The rounding rule applied to tax, recorded at issue; null while draft
        line_net_total: {$ref: '#/components/schemas/Amount'}
        allowance_total:
          allOf: [{$ref: '#/components/schemas/Amount'}]
          description: BT-107; always 0 in phase 1
        charge_total:
          allOf: [{$ref: '#/components/schemas/Amount'}]
          description: BT-108; always 0 in phase 1
        tax_exclusive_total: {$ref: '#/components/schemas/Amount'}
        tax_total: {$ref: '#/components/schemas/Amount'}
        tax_inclusive_total: {$ref: '#/components/schemas/Amount'}
        prepaid_amount: {$ref: '#/components/schemas/Amount'}
        rounding_amount:
          allOf: [{$ref: '#/components/schemas/Amount'}]
          description: BT-114; always 0 in phase 1
        amount_due: {$ref: '#/components/schemas/Amount'}
        amount_paid:
          allOf: [{$ref: '#/components/schemas/Amount'}]
          description: Sum of recorded payments
        payment_status:
          type: [string, 'null']
          enum: [unpaid, partially_paid, paid, null]
          description: Derived from payments; null for drafts and credit notes
        version:
          type: integer
          description: Increments on every draft edit; the `ETag` value
        lines:
          type: array
          items: {$ref: '#/components/schemas/InvoiceLine'}
        tax_breakdown:
          type: array
          items: {$ref: '#/components/schemas/TaxBreakdown'}
        parties:
          description: Seller and buyer as copied at issue; empty while draft
          type: array
          items: {$ref: '#/components/schemas/InvoiceParty'}
        retention_until:
          type: [string, 'null']
          format: date
          description: Earliest date the document may be deleted under the jurisdiction's retention rule
        issued_at: {type: [string, 'null'], format: date-time}
        voided_at: {type: [string, 'null'], format: date-time}
        void_reason: {type: [string, 'null']}
        corrected_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    InvoiceList:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Invoice'}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}
    VoidRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
    VoidResult:
      type: object
      additionalProperties: false
      required: [voided_invoice, credit_note]
      properties:
        voided_invoice: {$ref: '#/components/schemas/Invoice'}
        credit_note: {$ref: '#/components/schemas/Invoice'}
    InvoiceFile:
      type: object
      additionalProperties: false
      required: [kind, content_type, byte_size, sha256, url, url_expires_at]
      properties:
        kind:
          type: string
          enum: [pdf, xrechnung, zugferd, validation_report]
          description: Only `pdf` in phase 1
        content_type: {type: string}
        byte_size: {type: integer, format: int64}
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Hex SHA-256 of the archived file
        url:
          type: string
          format: uri
          description: Signed download URL; expires at `url_expires_at`
        url_expires_at: {type: string, format: date-time}

    # ---------- payments ----------
    PaymentCreate:
      type: object
      additionalProperties: false
      required: [amount, paid_on]
      properties:
        amount:
          allOf: [{$ref: '#/components/schemas/PositiveAmount'}]
          description: Greater than 0
        paid_on: {type: string, format: date}
        method: {type: [string, 'null'], maxLength: 50}
        external_ref: {type: [string, 'null'], maxLength: 100}
    Payment:
      type: object
      additionalProperties: false
      required: [id, invoice_id, amount, paid_on, method, external_ref, created_at]
      properties:
        id: {type: string, format: uuid}
        invoice_id: {type: string, format: uuid}
        amount: {$ref: '#/components/schemas/Amount'}
        paid_on: {type: string, format: date}
        method: {type: [string, 'null']}
        external_ref: {type: [string, 'null']}
        created_at: {type: string, format: date-time}

    # ---------- webhooks ----------
    WebhookEndpoint:
      type: object
      additionalProperties: false
      required: [id, url, event_types, enabled, disabled_reason, previous_secret_expires_at, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        url: {type: string, format: uri}
        event_types:
          type: array
          description: Empty means all event types, including ones added later
          items: {$ref: '#/components/schemas/EventType'}
        enabled: {type: boolean}
        disabled_reason:
          type: [string, 'null']
          description: Why the platform disabled the endpoint, e.g. after `410 Gone`
        previous_secret_expires_at:
          type: [string, 'null']
          format: date-time
          description: While set, deliveries are also signed with the previous secret
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    WebhookEndpointList:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/WebhookEndpoint'}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}
    WebhookEndpointCreate:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2000
        event_types:
          type: array
          default: []
          uniqueItems: true
          items: {$ref: '#/components/schemas/EventType'}
        enabled: {type: boolean, default: true}
    WebhookEndpointPatch:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2000
        event_types:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/EventType'}
        enabled: {type: boolean}
    WebhookEndpointCreated:
      allOf:
        - {$ref: '#/components/schemas/WebhookEndpoint'}
        - {$ref: '#/components/schemas/OneTimeSecret'}
    WebhookSecretRotated:
      allOf:
        - {$ref: '#/components/schemas/OneTimeSecret'}
        - type: object
          required: [previous_secret_expires_at]
          properties:
            previous_secret_expires_at: {type: string, format: date-time}
    OneTimeSecret:
      type: object
      required: [secret, secret_redacted]
      properties:
        secret:
          type: [string, 'null']
          description: '`whsec_` + base64 of 32 random bytes. Shown once; null on a replay.'
          examples: [whsec_RVhBTVBMRU9OTFlub3RhcmVhbHNlY3JldDAwMDAwMDA=]
        secret_redacted:
          type: boolean
          description: true when this is a replay and the secret was removed
    WebhookDelivery:
      type: object
      additionalProperties: false
      required: [id, event_id, event_type, endpoint_id, status, attempt_count, next_attempt_at, last_attempt_at, last_response_status, last_error, succeeded_at, created_at]
      properties:
        id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        event_type: {$ref: '#/components/schemas/EventType'}
        endpoint_id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/DeliveryStatus'}
        attempt_count: {type: integer, minimum: 0, maximum: 10}
        next_attempt_at: {type: [string, 'null'], format: date-time}
        last_attempt_at: {type: [string, 'null'], format: date-time}
        last_response_status: {type: [integer, 'null']}
        last_error:
          type: [string, 'null']
          description: Short description of the last failure; never contains the request body
        succeeded_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    WebhookDeliveryList:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/WebhookDelivery'}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}

    Event:
      description: Standard Webhooks envelope. Contains no personal data.
      type: object
      required: [type, timestamp, data]
      properties:
        type: {$ref: '#/components/schemas/EventType'}
        timestamp:
          type: string
          format: date-time
          description: When the event happened (not when this attempt was sent)
        data: {$ref: '#/components/schemas/EventInvoice'}
      example:
        type: invoice.issued
        timestamp: '2026-11-01T09:30:00Z'
        data:
          object: invoice
          id: 0b6c8e1d-2f3a-4b5c-9d6e-7f8a9b0c1d2e
          document_type: invoice
          status: issued
          number: INV-2026-000042
          customer_id: 7d1e2f4a-0c3b-4e5f-8a9b-1c2d3e4f5a6b
          preceding_invoice_id: null
          issue_date: '2026-11-01'
          currency: EUR
          tax_inclusive_total: '1173.19'
          amount_due: '1173.19'
          amount_paid: '0.00'
    EventInvoice:
      description: Snapshot of the document at event time. Fetch `GET /invoices/{id}` for details.
      type: object
      required: [object, id, document_type, status, number, customer_id, preceding_invoice_id, issue_date, currency, tax_inclusive_total, amount_due, amount_paid]
      properties:
        object:
          type: string
          const: invoice
        id: {type: string, format: uuid}
        document_type: {$ref: '#/components/schemas/DocumentType'}
        status: {$ref: '#/components/schemas/InvoiceStatus'}
        number: {type: string}
        customer_id: {type: string, format: uuid}
        preceding_invoice_id: {type: [string, 'null'], format: uuid}
        issue_date: {type: string, format: date}
        currency: {$ref: '#/components/schemas/Currency'}
        tax_inclusive_total: {$ref: '#/components/schemas/Amount'}
        amount_due: {$ref: '#/components/schemas/Amount'}
        amount_paid: {$ref: '#/components/schemas/Amount'}
