# sqlc reads the migrations as the schema and generates internal/store from
# the queries next to it (ADR 0005). Regenerate with `go generate ./...`.
version: "2"
sql:
  - engine: postgresql
    schema: ../../supabase/migrations
    queries: internal/store/queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type: {import: github.com/google/uuid, type: UUID, pointer: true}
          # Money, quantities, prices, and rates: never a float (D1).
          - db_type: pg_catalog.numeric
            go_type: github.com/shopspring/decimal.Decimal
          - db_type: pg_catalog.numeric
            nullable: true
            go_type: {import: github.com/shopspring/decimal, type: Decimal, pointer: true}
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type: {type: time.Time, pointer: true}
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type: {type: time.Time, pointer: true}
